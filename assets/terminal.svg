<svg xmlns="http://www.w3.org/2000/svg" width="860" height="326" viewBox="0 0 860 326" role="img" aria-label="Terminal Interface">
<title>Umrzoq Yulchiyev — Terminal Interface</title>
<defs>
  <linearGradient id="tbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f2fe"/>
    <stop offset="0.55" stop-color="#4facfe"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="tnm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f2fe"/>
    <stop offset="1" stop-color="#4facfe"/>
  </linearGradient>
  <filter id="tblur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="35"/>
  </filter>
  <clipPath id="twin">
    <rect x="14" y="14" width="832" height="298" rx="14"/>
  </clipPath>
  <style>
    @keyframes cycle0 { 0%, 30% { opacity: 1; visibility: visible; } 33.3%, 100% { opacity: 0; visibility: hidden; } }
    @keyframes cycle1 { 0%, 30% { opacity: 0; visibility: hidden; } 33.3%, 63.3% { opacity: 1; visibility: visible; } 66.6%, 100% { opacity: 0; visibility: hidden; } }
    @keyframes cycle2 { 0%, 63.3% { opacity: 0; visibility: hidden; } 66.6%, 96.6% { opacity: 1; visibility: visible; } 99.9%, 100% { opacity: 0; visibility: hidden; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .g0 { animation: cycle0 12s infinite; }
    .g1 { animation: cycle1 12s infinite; }
    .g2 { animation: cycle2 12s infinite; }
    .blink { animation: blink 0.9s infinite; }
  </style>
</defs>

<!-- Ambient Backlight -->
<circle cx="150" cy="280" r="90" fill="#8b5cf6" opacity="0.30" filter="url(#tblur)"/>
<circle cx="720" cy="50" r="90" fill="#00f2fe" opacity="0.25" filter="url(#tblur)"/>

<!-- Terminal Container -->
<rect x="14" y="14" width="832" height="298" rx="14" fill="#0d1117"/>
<g clip-path="url(#twin)">
  <rect x="14" y="14" width="832" height="38" fill="#161b22"/>
  <line x1="14" y1="52" x2="846" y2="52" stroke="#30363d"/>
</g>
<rect x="14" y="14" width="832" height="298" rx="14" fill="none" stroke="url(#tbd)" stroke-opacity="0.65" stroke-width="1.5"/>

<!-- Window Controls -->
<circle cx="38" cy="33" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
<circle cx="60" cy="33" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
<circle cx="82" cy="33" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>
<text x="430" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">umrzoq@School21 — ~/ai-systems — zsh</text>

